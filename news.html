<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>F1 News</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@400;600;700;900&display=swap">
<style>
:root{--bg:#f4f4f5;--panel:#fff;--fg:#15151e;--muted:#6b6b78;--line:#dcdce0;--red:#e10600;--on-red:#fff;--font:"Titillium Web","Segoe UI",Arial,sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#15151e;--panel:#1f1f2b;--fg:#fff;--muted:#a0a0b0;--line:#33333f;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);padding-inline:16px;padding-block:20px;font-size:15px}
main{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
h1{margin:0;font-size:28px;font-weight:900;font-style:italic;text-transform:uppercase;letter-spacing:.02em}
nav{display:flex;gap:6px;border-bottom:3px solid var(--red);margin-bottom:4px}
nav a{flex:1;text-align:center;padding:10px 4px;font-weight:700;text-transform:uppercase;font-size:13px;letter-spacing:.08em;color:var(--muted);text-decoration:none}
nav a[aria-current]{background:var(--red);color:#fff}
a:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.tz{color:var(--muted);font-size:12px;margin:0}
.next{background:var(--red);color:var(--on-red);padding:16px;border-radius:4px;display:flex;flex-direction:column;gap:6px}
.next small{text-transform:uppercase;letter-spacing:.1em;font-weight:700;opacity:.85}
.next h2{margin:0;font-size:24px;font-weight:900}
.next ul{margin:4px 0 0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:4px 16px;font-variant-numeric:tabular-nums}
.tbl{background:var(--panel);padding:12px 14px;overflow-x:auto}
.tbl h3{margin:0 0 8px;font-size:18px;font-weight:900;text-transform:uppercase;border-left:4px solid var(--red);padding-left:10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tbl table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:14px}
.tbl th{text-align:left;color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.tbl td,.tbl th{padding:5px 8px 5px 0;white-space:nowrap}.tbl tr.pod td:first-child{color:var(--red);font-weight:900}
.badge{background:var(--red);color:#fff;font-size:11px;padding:2px 8px;letter-spacing:.1em}
.badge.live{animation:p 1.4s infinite}@keyframes p{50%{opacity:.45}}
@media (prefers-reduced-motion:reduce){.badge.live{animation:none}}
.note{color:var(--muted);font-size:12px;margin:6px 0 0}
details{background:var(--panel);padding:10px 14px}summary{cursor:pointer;font-weight:700;text-transform:uppercase;font-size:13px;letter-spacing:.08em}
.race{border-left:4px solid var(--line);padding:10px 12px;margin-top:8px;display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center}
.race.done{opacity:.55}.race.is-next{border-left-color:var(--red)}
.rd{font-weight:900;font-size:20px;color:var(--red)}.race b{font-size:16px}
.race p{margin:2px 0 0;color:var(--muted);font-size:13px;min-width:0}
.when{text-align:right;font-variant-numeric:tabular-nums;font-size:14px;font-weight:600}
.when i{display:block;font-style:normal;color:var(--muted);font-weight:400;font-size:12px}
@media(max-width:480px){.race{grid-template-columns:36px 1fr}.when{grid-column:2;text-align:left}}
.sec{margin:4px 0 8px;font-size:20px;font-weight:900;font-style:italic;text-transform:uppercase}
.pods{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.pod{background:var(--panel);padding:12px 14px;min-width:0}
.pod h3{margin:0 0 10px;font-size:14px;font-weight:900;text-transform:uppercase;border-left:4px solid var(--red);padding-left:10px}
.steps{display:grid;grid-template-columns:1fr 1.15fr 1fr;align-items:end;gap:6px}
.col{display:flex;flex-direction:column;align-items:center;text-align:center;min-width:0}
.who{display:flex;flex-direction:column;align-items:center;gap:3px;padding-bottom:6px;min-width:0;width:100%}
.who b{font-size:13px;line-height:1.15;overflow-wrap:anywhere}.who small{color:var(--muted);font-size:11px;line-height:1.2}
.face,.ini{width:58px;height:58px;border-radius:50%;object-fit:cover;object-position:top;background:var(--line)}
.logo{width:52px;height:52px;border-radius:10px;object-fit:contain;background:#fff;padding:4px}
.ini{display:flex;align-items:center;justify-content:center;font-weight:900;color:var(--muted);border-radius:50%}
.step{width:100%;background:var(--c);display:flex;justify-content:center;align-items:flex-start;padding-top:4px;font-weight:900;font-size:26px}
.p1 .step{height:84px}.p2 .step{height:60px}.p3 .step{height:44px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
h2{margin:0;font-size:18px;font-weight:900;text-transform:uppercase;border-left:4px solid var(--red);padding-left:10px}
.card{background:var(--panel);display:flex;flex-direction:column;color:inherit;text-decoration:none;min-width:0}
.card img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:var(--line)}
.card div{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px}
.card small{color:var(--red);font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:11px}
.card small i{color:var(--muted);font-style:normal;font-weight:400}
.card b{font-size:16px;line-height:1.25}.card p{margin:0;color:var(--muted);font-size:13px;line-height:1.4}
.card:hover b{text-decoration:underline}
main{max-width:900px}
</style></head><body>
<main>
<h1>F1 News</h1><nav><a href="./">Schedule</a><a href="standings.html">Standings</a><a href="news.html" aria-current=page>News</a></nav>
<section id="race" hidden style="display:flex;flex-direction:column;gap:10px"></section>
<section style="display:flex;flex-direction:column;gap:10px"><h2>Latest from around the web</h2><div class="grid" id="all"></div></section>
<p class="note" id="foot"></p>
</main>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ago=t=>{const m=Math.round((Date.now()-new Date(t))/6e4);return m<60?m+" min ago":m<1440?Math.round(m/60)+" h ago":Math.round(m/1440)+" d ago"};
const card=i=>`<a class="card" href="${esc(i.link)}" target="_blank" rel="noopener noreferrer">${i.image?`<img src="${esc(i.image)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">`:""}<div><small>${esc(i.source)} <i>· ${ago(i.time)}</i></small><b>${esc(i.title)}</b>${i.summary?`<p>${esc(i.summary)}</p>`:""}</div></a>`;
(async()=>{
  const [n,cal]=await Promise.all([fetch("news.json?"+Date.now()).then(r=>r.json()),fetch("https://api.jolpi.ca/ergast/f1/current.json").then(r=>r.json()).catch(()=>null)]);
  $("all").innerHTML=n.items.map(card).join("");
  $("foot").textContent=`Headlines from BBC Sport, Motorsport.com, The Race, Sky Sports, Formula1.com and Crash.net. Tap a box to read the full story at the source. Updated ${new Date(n.updated).toLocaleString("en-SG",{timeZone:"Asia/Singapore",day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})} SGT.`;
  if(!cal)return;
  const done=cal.MRData.RaceTable.Races.filter(r=>new Date(`${r.date}T${r.time||"00:00:00Z"}`)<Date.now()).pop();
  if(!done)return;
  const L=done.Circuit.Location,keys=[L.locality,L.country,done.raceName.replace(/ Grand Prix.*/,"")].filter(k=>k&&k.length>3).map(k=>k.toLowerCase());
  const hits=n.items.filter(i=>keys.some(k=>(i.title+" "+i.summary).toLowerCase().includes(k))).slice(0,9);
  if(hits.length){$("race").hidden=false;$("race").innerHTML=`<h2>${esc(done.raceName)}: what happened</h2><div class="grid">${hits.map(card).join("")}</div>`}
})().catch(()=>$("all").textContent="Could not load the news. Refresh to retry.");
</script></body></html>
