<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>F1 Standings</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@400;600;700;900&display=swap">
<style>
:root{--bg:#f4f4f5;--panel:#fff;--fg:#15151e;--muted:#6b6b78;--line:#dcdce0;--red:#e10600;--on-red:#fff;--font:"Titillium Web","Segoe UI",Arial,sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#15151e;--panel:#1f1f2b;--fg:#fff;--muted:#a0a0b0;--line:#33333f;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);padding-inline:16px;padding-block:20px;font-size:15px}
main{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
h1{margin:0;font-size:28px;font-weight:900;font-style:italic;text-transform:uppercase;letter-spacing:.02em}
nav{display:flex;gap:6px;border-bottom:3px solid var(--red);margin-bottom:4px}
nav a{flex:1;text-align:center;padding:10px 4px;font-weight:700;text-transform:uppercase;font-size:13px;letter-spacing:.08em;color:var(--muted);text-decoration:none}
nav a[aria-current]{background:var(--red);color:#fff}
a:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.tz{color:var(--muted);font-size:12px;margin:0}
.next{background:var(--red);color:var(--on-red);padding:16px;border-radius:4px;display:flex;flex-direction:column;gap:6px}
.next small{text-transform:uppercase;letter-spacing:.1em;font-weight:700;opacity:.85}
.next h2{margin:0;font-size:24px;font-weight:900}
.next ul{margin:4px 0 0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:4px 16px;font-variant-numeric:tabular-nums}
.tbl{background:var(--panel);padding:12px 14px;overflow-x:auto}
.tbl h3{margin:0 0 8px;font-size:18px;font-weight:900;text-transform:uppercase;border-left:4px solid var(--red);padding-left:10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tbl table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:14px}
.tbl th{text-align:left;color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.tbl td,.tbl th{padding:5px 8px 5px 0;white-space:nowrap}.tbl tr.pod td:first-child{color:var(--red);font-weight:900}
.badge{background:var(--red);color:#fff;font-size:11px;padding:2px 8px;letter-spacing:.1em}
.badge.live{animation:p 1.4s infinite}@keyframes p{50%{opacity:.45}}
@media (prefers-reduced-motion:reduce){.badge.live{animation:none}}
.note{color:var(--muted);font-size:12px;margin:6px 0 0}
details{background:var(--panel);padding:10px 14px}summary{cursor:pointer;font-weight:700;text-transform:uppercase;font-size:13px;letter-spacing:.08em}
.race{border-left:4px solid var(--line);padding:10px 12px;margin-top:8px;display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center}
.race.done{opacity:.55}.race.is-next{border-left-color:var(--red)}
.rd{font-weight:900;font-size:20px;color:var(--red)}.race b{font-size:16px}
.race p{margin:2px 0 0;color:var(--muted);font-size:13px;min-width:0}
.when{text-align:right;font-variant-numeric:tabular-nums;font-size:14px;font-weight:600}
.when i{display:block;font-style:normal;color:var(--muted);font-weight:400;font-size:12px}
@media(max-width:480px){.race{grid-template-columns:36px 1fr}.when{grid-column:2;text-align:left}}
</style></head><body>
<main>
<h1>F1 Standings</h1>
<nav><a href="./">Schedule</a><a href="standings.html" aria-current=page>Standings</a><a href="news.html">News</a></nav>
<section id="live" hidden></section><section id="res"></section><section id="std"></section><section id="con"></section><p class="note" id="note"></p>
</main>
<script>
const $=id=>document.getElementById(id);
const tz="Asia/Singapore";
const fD=d=>d.toLocaleDateString("en-SG",{weekday:"short",day:"numeric",month:"short",timeZone:tz});
const fT=d=>d.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit",timeZone:tz});
const J="https://api.jolpi.ca/ergast/f1/current/",O="https://api.openf1.org/v1/";
const jget=p=>fetch(J+p).then(r=>r.json()).then(j=>j.MRData);
const oget=p=>fetch(O+p).then(r=>r.ok?r.json():[]).catch(()=>[]);
const code=x=>x.code||x.familyName.slice(0,3).toUpperCase();
const KEYS=[["FirstPractice","FP1"],["SecondPractice","FP2"],["ThirdPractice","FP3"],["SprintQualifying","Sprint Quali"],["Sprint","Sprint"],["Qualifying","Qualifying"]];
const dt=o=>new Date(`${o.date}T${o.time||"00:00:00Z"}`);
const sessions=r=>[...KEYS.filter(([k])=>r[k]).map(([k,l])=>[l,dt(r[k])]),["Race",dt(r)]];
const POINTS=[25,18,15,12,10,8,6,4,2,1];
const tbl=(t,hd,rows,extra="")=>`<div class="tbl"><h3>${t}${extra}</h3><table><tr>${hd.map(x=>`<th>${x}</th>`).join("")}</tr>${rows.map(r=>`<tr class="${r[0]<=3?"pod":""}">${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</table></div>`;
const PROV='<span class="badge">PROVISIONAL</span>';
// Official numbers come from the results feed. If it is behind a race that has finished,
// build the same tables from live-timing positions and label them provisional.
async function provisional(cal,L,D,C){
  const lastRound=L?+L.round:0,now=Date.now();
  const race=cal.filter(r=>+r.round>lastRound&&dt(r).getTime()+3*3600e3<now).pop();
  if(!race)return null;
  const s=(await oget(`sessions?year=${race.season}&session_name=Race`)).find(x=>x.date_start.slice(0,10)===race.date);
  if(!s)return null;
  const drv={};(await oget(`drivers?session_key=${s.session_key}`)).forEach(d=>drv[d.driver_number]=d.name_acronym);
  const fin={};(await oget(`position?session_key=${s.session_key}`)).forEach(p=>fin[p.driver_number]=p.position);
  const order=Object.entries(fin).sort((a,b)=>a[1]-b[1]).map(([n])=>drv[n]||n);
  const T={};D.forEach(x=>T[code(x.Driver)]={team:x.Constructors[0].name,id:x.Constructors[0].constructorId,pts:+x.points,wins:+x.wins});
  const CP={};C.forEach(x=>CP[x.Constructor.constructorId]={name:x.Constructor.name,pts:+x.points,wins:+x.wins});
  const res=order.map((c,i)=>{const p=i<10?POINTS[i]:0;if(T[c]){T[c].pts+=p;T[c].wins+=i===0?1:0;if(CP[T[c].id]){CP[T[c].id].pts+=p;CP[T[c].id].wins+=i===0?1:0}}return[i+1,c,(T[c]||{}).team||"","provisional",p]});
  const drivers=Object.entries(T).sort((a,b)=>b[1].pts-a[1].pts||b[1].wins-a[1].wins).map(([c,v],i)=>[i+1,c,v.team,v.wins,v.pts]);
  const cons=Object.values(CP).sort((a,b)=>b.pts-a.pts||b.wins-a.wins).map((v,i)=>[i+1,v.name,v.wins,v.pts]);
  return{title:`Last race · R${race.round} ${race.raceName}`,res,drivers,cons};
}
(async()=>{
  const [cal,last,ds,cs]=await Promise.all([jget("races.json"),jget("last/results.json"),jget("driverstandings.json"),jget("constructorstandings.json")]);
  const L=last.RaceTable.Races[0],D=ds.StandingsTable.StandingsLists[0].DriverStandings,C=cs.StandingsTable.StandingsLists[0].ConstructorStandings;
  let v=await provisional(cal.RaceTable.Races,L,D,C).catch(()=>null),badge="";
  if(v)badge=PROV;
  else v={title:`Last race · R${L.round} ${L.raceName}`,res:L.Results.map(r=>[r.position,code(r.Driver),r.Constructor.name,(r.Time&&r.Time.time)||r.status,r.points]),drivers:D.map(s=>[s.position,code(s.Driver),s.Constructors[0].name,s.wins,s.points]),cons:C.map(s=>[s.position,s.Constructor.name,s.wins,s.points])};
  $("res").innerHTML=tbl(v.title,["Pos","Driver","Team","Time / Status","Pts"],v.res,badge);
  $("std").innerHTML=tbl("Driver standings",["Pos","Driver","Team","Wins","Pts"],v.drivers,badge);
  $("con").innerHTML=tbl("Constructor standings",["Pos","Team","Wins","Pts"],v.cons,badge);
  if(badge)$("note").textContent="Provisional: built from live-timing positions while official results are pending. This page switches to the official numbers by itself.";
})().catch(()=>$("res").textContent="Could not load standings. Refresh to retry.");

// Live positions, only while a race is running
let sess=null,drivers={},pos={},lastPos=null,timer=null;
async function liveTick(){
  const end=new Date(sess.date_end),now=new Date(),ref=now<end?now:end;
  const rows=await oget(`position?session_key=${sess.session_key}${lastPos?`&date>${lastPos}`:""}&date<${ref.toISOString()}`);
  rows.forEach(p=>{pos[p.driver_number]=p;lastPos=new Date(p.date).toISOString()});
  const gaps={};(await oget(`intervals?session_key=${sess.session_key}&date>${new Date(ref-60e3).toISOString()}`)).forEach(i=>gaps[i.driver_number]=i.gap_to_leader);
  const body=Object.values(pos).sort((a,b)=>a.position-b.position).map(p=>{const d=drivers[p.driver_number]||{},g=gaps[p.driver_number];return[p.position,d.name_acronym||p.driver_number,d.team_name||"",p.position===1?"Leader":(typeof g==="number"?"+"+g.toFixed(3):(g||""))]});
  $("live").hidden=false;
  $("live").innerHTML=tbl(`${sess.location} Grand Prix`,["Pos","Driver","Team","Gap"],body,'<span class="badge live">LIVE</span>')+`<p class="note">Updated ${fT(new Date())} SGT · refreshes every 10 s</p>`;
  if(new Date()>new Date(+end+10*60e3)){clearInterval(timer);$("live").hidden=true}
}
(async()=>{
  const now=new Date(),all=await oget(`sessions?year=${now.getFullYear()}&session_name=Race`);
  sess=all.find(s=>new Date(s.date_start)-20*60e3<=now&&now<=new Date(+new Date(s.date_end)+10*60e3));
  if(!sess)return;
  (await oget(`drivers?session_key=${sess.session_key}`)).forEach(d=>drivers[d.driver_number]=d);
  await liveTick();timer=setInterval(liveTick,10000);
})();
</script></body></html>
