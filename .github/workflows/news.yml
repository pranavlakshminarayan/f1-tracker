name: F1 news
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python fetch_news.py
      - run: python update_readme.py
      - run: |
          git config user.name "f1-news-bot"; git config user.email "bot@users.noreply.github.com"
          git add news.json README.md
          git diff --cached --quiet || (git commit -m "Update news" && git pull --rebase -q && git push)
