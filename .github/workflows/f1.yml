name: F1 daily check
on:
  schedule:
    - cron: "0 0 * * *"   # 08:00 Singapore time
  workflow_dispatch:
    inputs:
      test:
        description: "Send a test message even if no session today"
        type: boolean
        default: false
jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python f1_bot.py ${{ inputs.test && '--force-test' || '' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
