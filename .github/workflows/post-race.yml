name: F1 post-race update
on:
  schedule:
    - cron: "*/15 * * * 0,1,6"   # Sat/Sun/Mon UTC; does nothing unless a finished race has not been posted yet
  workflow_dispatch:
concurrency:
  group: f1-post
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install pillow
      - run: python f1_post.py --auto
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - run: |
          git config user.name "f1-bot"; git config user.email "bot@users.noreply.github.com"
          git add post_state.json
          git diff --cached --quiet || (git commit -m "Record posted race" && git pull --rebase -q && git push)
