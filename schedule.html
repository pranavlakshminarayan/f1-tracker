<title>F1 2026 Schedule</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@400;600;700;900&display=swap">
<style>
/* Layout: race list, next race pinned on top as a red panel, times in Singapore time */
:root{--bg:#f4f4f5;--panel:#fff;--fg:#15151e;--muted:#6b6b78;--line:#dcdce0;--red:#e10600;--on-red:#fff;
--font:"Titillium Web","Segoe UI",Arial,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15151e;--panel:#1f1f2b;--fg:#fff;--muted:#a0a0b0;--line:#33333f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15151e;--panel:#1f1f2b;--fg:#fff;--muted:#a0a0b0;--line:#33333f;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--font);padding-inline:16px;padding-block:20px}
main{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:3px solid var(--red);padding-bottom:10px}
h1{margin:0;font-size:28px;font-weight:900;font-style:italic;text-transform:uppercase;letter-spacing:.02em}
header span{color:var(--muted);font-size:13px;text-transform:uppercase;letter-spacing:.08em}
.next{background:var(--red);color:var(--on-red);padding:16px;border-radius:4px;display:flex;flex-direction:column;gap:6px}
.next small{text-transform:uppercase;letter-spacing:.1em;font-weight:700;opacity:.85}
.next h2{margin:0;font-size:24px;font-weight:900}
.next ul{margin:4px 0 0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:4px 16px;font-variant-numeric:tabular-nums}
.tbl{background:var(--panel);padding:12px 14px;overflow-x:auto}
.tbl h3{margin:0 0 8px;font-size:18px;font-weight:900;text-transform:uppercase;border-left:4px solid var(--red);padding-left:10px}
.tbl table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:14px}
.tbl th{text-align:left;color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.tbl td,.tbl th{padding:5px 8px 5px 0;white-space:nowrap}.tbl tr.pod td:first-child{color:var(--red);font-weight:900}
.race{background:var(--panel);border-left:4px solid var(--line);padding:12px 14px;display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center}
.race.done{opacity:.55}
.race.is-next{border-left-color:var(--red)}
.rd{font-weight:900;font-size:22px;color:var(--red)}
.race b{font-size:17px}
.race p{margin:2px 0 0;color:var(--muted);font-size:13px;min-width:0}
.when{text-align:right;font-variant-numeric:tabular-nums;font-size:14px;font-weight:600}
.when i{display:block;font-style:normal;color:var(--muted);font-weight:400;font-size:12px}
@media(max-width:480px){.race{grid-template-columns:36px 1fr}.when{grid-column:2;text-align:left}}
</style>
<main>
<header><h1>F1 2026 Schedule</h1><span>Times in Singapore (SGT)</span></header>
<section id="next"></section><section id="res"></section><section id="std"></section><section id="list" style="display:flex;flex-direction:column;gap:8px"></section>
</main>

const fmtT=d=>d.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit",timeZone:"Asia/Singapore"});
const now=new Date();
races.forEach(r=>{r.s=r.sessions.map(([n,t])=>[n,new Date(t.endsWith("Z")?t:t+"Z")]);r.race=r.s[r.s.length-1][1];});
const nxt=races.find(r=>r.race.getTime()+2*3600e3>now);

const tbl=(t,hd,rows)=>`<div class="tbl"><h3>${t}</h3><table><tr>${hd.map(x=>`<th>${x}</th>`).join("")}</tr>${rows.map(r=>`<tr class="${r[0]<=3?"pod":""}">${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</table></div>`;
document.getElementById("res").innerHTML=tbl(`Last race · R${R.round} ${R.name}`,["Pos","Driver","Team","Time / Status","Pts"],R.rows);

document.getElementById("list").innerHTML=races.map(r=>`<div class="race ${r.race<now&&r!==nxt?"done":""} ${r===nxt?"is-next":""}"><span class="rd">${String(r.round).padStart(2,"0")}</span><div><b>${r.name}</b><p>${r.circuit} · ${r.place}</p></div><div class="when">${fmtD(r.race)}<i>Race ${fmtT(r.race)}</i></div></div>`).join("");
