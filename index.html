<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>F1 2026 Schedule</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@400;600;700;900&display=swap">
<style>
:root{--bg:#f4f4f5;--panel:#fff;--fg:#15151e;--muted:#6b6b78;--line:#dcdce0;--red:#e10600;--on-red:#fff;--font:"Titillium Web","Segoe UI",Arial,sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#15151e;--panel:#1f1f2b;--fg:#fff;--muted:#a0a0b0;--line:#33333f;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);padding-inline:16px;padding-block:20px;font-size:15px}
main{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:3px solid var(--red);padding-bottom:10px}
h1{margin:0;font-size:28px;font-weight:900;font-style:italic;text-transform:uppercase;letter-spacing:.02em}
nav{display:flex;gap:16px;font-weight:700;text-transform:uppercase;font-size:13px;letter-spacing:.08em}nav a{color:var(--muted);text-decoration:none;padding-bottom:2px}nav a[aria-current]{color:var(--fg);border-bottom:2px solid var(--red)}
.tz{color:var(--muted);font-size:12px;margin:0}
.next{background:var(--red);color:var(--on-red);padding:16px;border-radius:4px;display:flex;flex-direction:column;gap:6px}
.next small{text-transform:uppercase;letter-spacing:.1em;font-weight:700;opacity:.85}
.next h2{margin:0;font-size:24px;font-weight:900}
.next ul{margin:4px 0 0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:4px 16px;font-variant-numeric:tabular-nums}
.tbl{background:var(--panel);padding:12px 14px;overflow-x:auto}
.tbl h3{margin:0 0 8px;font-size:18px;font-weight:900;text-transform:uppercase;border-left:4px solid var(--red);padding-left:10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tbl table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:14px}
.tbl th{text-align:left;color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.tbl td,.tbl th{padding:5px 8px 5px 0;white-space:nowrap}.tbl tr.pod td:first-child{color:var(--red);font-weight:900}
.badge{background:var(--red);color:#fff;font-size:11px;padding:2px 8px;letter-spacing:.1em}
.badge.live{animation:p 1.4s infinite}@keyframes p{50%{opacity:.45}}
@media (prefers-reduced-motion:reduce){.badge.live{animation:none}}
.note{color:var(--muted);font-size:12px;margin:6px 0 0}
.race{background:var(--panel);border-left:4px solid var(--line);padding:12px 14px;display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center}
.race.done{opacity:.55}.race.is-next{border-left-color:var(--red)}
.rd{font-weight:900;font-size:22px;color:var(--red)}.race b{font-size:17px}
.race p{margin:2px 0 0;color:var(--muted);font-size:13px;min-width:0}
.when{text-align:right;font-variant-numeric:tabular-nums;font-size:14px;font-weight:600}
.when i{display:block;font-style:normal;color:var(--muted);font-weight:400;font-size:12px}
#list{display:flex;flex-direction:column;gap:8px}
@media(max-width:480px){.race{grid-template-columns:36px 1fr}.when{grid-column:2;text-align:left}}
</style></head><body>
<main>
<header><h1>F1 2026 Schedule</h1><nav><a href="./" aria-current="page">Schedule</a><a href="news.html">News</a></nav></header>
<p class="tz">All times in Singapore (SGT)</p><section id="live" hidden></section><section id="next"></section><section id="res"></section><section id="std"></section><section id="list"></section>
</main>
<script>
const J="https://api.jolpi.ca/ergast/f1/current/",O="https://api.openf1.org/v1/";
const jget=p=>fetch(J+p).then(r=>r.json()).then(j=>j.MRData);
const oget=p=>fetch(O+p).then(r=>r.ok?r.json():[]).catch(()=>[]);
const tz="Asia/Singapore";
const fD=d=>d.toLocaleDateString("en-SG",{weekday:"short",day:"numeric",month:"short",timeZone:tz});
const fT=d=>d.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit",timeZone:tz});
const code=x=>x.code||x.familyName.slice(0,3).toUpperCase();
const KEYS=[["FirstPractice","FP1"],["SecondPractice","FP2"],["ThirdPractice","FP3"],["SprintQualifying","Sprint Quali"],["Sprint","Sprint"],["Qualifying","Qualifying"]];
const dt=o=>new Date(`${o.date}T${o.time||"00:00:00Z"}`);
const sessions=r=>[...KEYS.filter(([k])=>r[k]).map(([k,l])=>[l,dt(r[k])]),["Race",dt(r)]];
const tbl=(t,hd,rows,extra="")=>`<div class="tbl"><h3>${t}${extra}</h3><table><tr>${hd.map(x=>`<th>${x}</th>`).join("")}</tr>${rows.map(r=>`<tr class="${r[0]<=3?"pod":""}">${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</table></div>`;
const $=id=>document.getElementById(id);

async function loadStatic(){
  const [cal,last,st]=await Promise.all([jget("races.json"),jget("last/results.json"),jget("driverstandings.json")]);
  const races=cal.RaceTable.Races;races.forEach(r=>{r.s=sessions(r);r.race=r.s[r.s.length-1][1]});
  const now=new Date(),nxt=races.find(r=>r.race.getTime()+2*3600e3>now);
  if(nxt)$("next").innerHTML=`<div class="next"><small>Next race · Round ${nxt.round}</small><h2>${nxt.raceName}</h2><span>${nxt.Circuit.circuitName} · ${nxt.Circuit.Location.locality}, ${nxt.Circuit.Location.country}</span><ul>${nxt.s.map(([n,d])=>`<li><b>${n}</b> ${fD(d)} ${fT(d)}</li>`).join("")}</ul></div>`;
  const L=last.RaceTable.Races[0];
  if(L)$("res").innerHTML=tbl(`Last race · R${L.round} ${L.raceName}`,["Pos","Driver","Team","Time / Status","Pts"],L.Results.slice(0,10).map(r=>[r.position,code(r.Driver),r.Constructor.name,(r.Time&&r.Time.time)||r.status,r.points]));
  const S=st.StandingsTable.StandingsLists[0];
  if(S)$("std").innerHTML=tbl("Driver standings",["Pos","Driver","Team","Wins","Pts"],S.DriverStandings.slice(0,10).map(s=>[s.position,code(s.Driver),s.Constructors[0].name,s.wins,s.points]));
  $("list").innerHTML=races.map(r=>`<div class="race ${r.race<now&&r!==nxt?"done":""} ${r===nxt?"is-next":""}"><span class="rd">${String(r.round).padStart(2,"0")}</span><div><b>${r.raceName}</b><p>${r.Circuit.circuitName} · ${r.Circuit.Location.locality}, ${r.Circuit.Location.country}</p></div><div class="when">${fD(r.race)}<i>Race ${fT(r.race)}</i></div></div>`).join("");
}

// Live positions (OpenF1): shown from 20 min before the race, kept as FINAL for 24h after
let sess=null,drivers={},pos={},lastPos=null,timer=null;
async function liveTick(){
  const now=new Date(),start=new Date(sess.date_start),end=new Date(sess.date_end);
  const live=now>=new Date(start-20*60e3)&&now<=new Date(+end+10*60e3);
  const ref=now<end?now:end;
  const q=lastPos?`&date>${lastPos}`:"";
  const rows=await oget(`position?session_key=${sess.session_key}${q}&date<${ref.toISOString()}`);
  rows.forEach(p=>{pos[p.driver_number]=p;lastPos=new Date(p.date).toISOString()});
  const gaps={};
  if(live)(await oget(`intervals?session_key=${sess.session_key}&date>${new Date(ref-60e3).toISOString()}`)).forEach(i=>gaps[i.driver_number]=i.gap_to_leader);
  const list=Object.values(pos).sort((a,b)=>a.position-b.position);
  const body=list.map(p=>{const d=drivers[p.driver_number]||{},g=gaps[p.driver_number];return [p.position,d.name_acronym||p.driver_number,d.team_name||"",p.position===1?"Leader":(typeof g==="number"?"+"+g.toFixed(3):(g||""))]});
  $("live").hidden=false;
  $("live").innerHTML=tbl(`${sess.location} Grand Prix`,["Pos","Driver","Team","Gap"],body,live?'<span class="badge live">LIVE</span>':'<span class="badge">FINAL</span>')+`<p class="note">Updated ${fT(new Date())} SGT${live?" · refreshes every 10 s":""}</p>`;
  if(!live&&timer){clearInterval(timer);timer=null}
}
async function loadLive(){
  const y=new Date().getFullYear(),all=await oget(`sessions?year=${y}&session_name=Race`),now=new Date();
  sess=all.filter(s=>new Date(s.date_start)-20*60e3<=now&&now<=new Date(+new Date(s.date_end)+24*3600e3)).pop();
  if(!sess)return;
  (await oget(`drivers?session_key=${sess.session_key}`)).forEach(d=>drivers[d.driver_number]=d);
  await liveTick();
  if(now<new Date(+new Date(sess.date_end)+10*60e3))timer=setInterval(liveTick,10000);
}
loadStatic().catch(()=>$("list").textContent="Could not load the schedule. Refresh to retry.");
loadLive();
</script></body></html>
